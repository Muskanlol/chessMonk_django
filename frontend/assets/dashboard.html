<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChessMonk — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --crimson:#dc143c; --crimson-bright:#ff1a4a; --crimson-dark:#8b0000;
  --crimson-glow:rgba(220,20,60,0.6); --crimson-dim:rgba(220,20,60,0.15);
  --gold:#c9a84c; --gold-bright:#ffd700; --gold-glow:rgba(201,168,76,0.5);
  --glass-bg:rgba(8,4,12,0.75); --glass-border:rgba(220,20,60,0.25);
  --black-deep:#020005; --text-primary:#f0e8d0;
  --text-secondary:#b09878; --text-dim:rgba(176,152,120,0.6);
  --sidebar-w:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Rajdhani',sans-serif;background:var(--black-deep);color:var(--text-primary);display:flex;}

.bg-canvas{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(100,0,20,0.4) 0%,transparent 65%),
  radial-gradient(ellipse 40% 30% at 10% 80%,rgba(80,0,15,0.25) 0%,transparent 60%),
  linear-gradient(180deg,#06000e 0%,#020005 60%,#040008 100%);}

.embers{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.ember{position:absolute;width:2px;height:2px;border-radius:50%;
  animation:floatUp var(--dur) ease-in infinite;animation-delay:var(--delay);
  left:var(--left);bottom:-10px;opacity:0;}
.ember.red{background:#ff1a4a;box-shadow:0 0 4px #ff1a4a;}
.ember.gold{background:#ffaa00;box-shadow:0 0 4px #ffaa00;width:1.5px;height:1.5px;}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) translateX(0) scale(1);}10%{opacity:1;}80%{opacity:.6;}100%{opacity:0;transform:translateY(-100vh) translateX(var(--drift)) scale(.3);}}

.sidebar{
  position:relative;z-index:10;
  width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;
  background:rgba(6,0,12,0.95);
  border-right:1px solid rgba(220,20,60,0.2);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.sidebar::after{content:'';position:absolute;top:0;right:0;width:1px;height:100%;
  background:linear-gradient(180deg,transparent,var(--crimson),var(--gold),var(--crimson),transparent);opacity:0.4;}

.sidebar-logo{padding:1.6rem 1.4rem 1.2rem;border-bottom:1px solid rgba(220,20,60,0.15);
  display:flex;align-items:center;gap:10px;}
.sidebar-logo .s-icon{font-size:1.6rem;filter:drop-shadow(0 0 10px var(--crimson-glow));}
.sidebar-logo .s-title{font-family:'Cinzel Decorative',serif;font-size:0.9rem;font-weight:900;
  background:linear-gradient(135deg,var(--crimson-bright),var(--gold-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.1em;}

.sidebar-nav{flex:1;padding:1.2rem 0;overflow-y:auto;}
.nav-section-label{font-family:'Cinzel',serif;font-size:0.52rem;letter-spacing:0.4em;
  text-transform:uppercase;color:var(--text-dim);padding:0.6rem 1.4rem 0.4rem;}

.nav-item{display:flex;align-items:center;gap:10px;padding:0.75rem 1.4rem;cursor:pointer;
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--text-secondary);transition:all 0.25s;position:relative;border-left:2px solid transparent;}
.nav-item:hover{color:var(--text-primary);background:rgba(220,20,60,0.06);}
.nav-item.active{color:var(--text-primary);background:rgba(220,20,60,0.12);border-left-color:var(--crimson-bright);}
.nav-item .n-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.nav-item .n-arrow{margin-left:auto;font-size:0.6rem;transition:transform 0.25s;}
.nav-item.open .n-arrow{transform:rotate(180deg);}

.nav-sub{overflow:hidden;max-height:0;transition:max-height 0.3s ease;}
.nav-sub.open{max-height:200px;}
.nav-sub-item{display:flex;align-items:center;gap:8px;
  padding:0.6rem 1.4rem 0.6rem 2.8rem;font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;transition:color 0.2s;}
.nav-sub-item:hover{color:var(--gold);}
.nav-sub-item .dot{width:4px;height:4px;border-radius:50%;background:var(--crimson-bright);flex-shrink:0;}

.sidebar-footer{padding:1rem 1.4rem;border-top:1px solid rgba(220,20,60,0.15);}
.logout-btn{width:100%;padding:0.65rem;font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.25em;text-transform:uppercase;background:transparent;
  border:1px solid rgba(220,20,60,0.3);color:var(--crimson-bright);cursor:pointer;
  transition:all 0.3s;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.logout-btn:hover{background:rgba(220,20,60,0.12);box-shadow:0 0 16px var(--crimson-glow);}

.main{position:relative;z-index:10;flex:1;height:100vh;overflow-y:auto;padding:2rem 2rem 3rem;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-track{background:transparent;}
.main::-webkit-scrollbar-thumb{background:rgba(220,20,60,0.3);}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.8rem;}
.welcome-text h2{font-family:'Cinzel Decorative',serif;font-size:1.5rem;font-weight:700;letter-spacing:0.05em;}
.welcome-text h2 span{background:linear-gradient(90deg,var(--crimson-bright),var(--gold-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.welcome-text p{font-size:0.85rem;color:var(--text-dim);margin-top:4px;letter-spacing:0.05em;}

.notif-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--crimson-bright);box-shadow:0 0 8px var(--crimson-bright);
  animation:blinkDot 2s ease infinite;vertical-align:middle;}
@keyframes blinkDot{0%,100%{opacity:1;}50%{opacity:0.2;}}

.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-border);position:relative;overflow:hidden;}
.glass::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(220,20,60,0.06) 0%,transparent 50%,rgba(201,168,76,0.03) 100%);
  pointer-events:none;}
.rune-pulse{position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--crimson),var(--gold),var(--crimson),transparent);
  animation:runeGlow 3s ease infinite;opacity:0;}
@keyframes runeGlow{0%,100%{opacity:0;transform:scaleX(.3);}50%{opacity:.9;transform:scaleX(1);}}
.rc{position:absolute;width:14px;height:14px;pointer-events:none;z-index:2;}
.rc.tl{top:0;left:0;border-top:1px solid var(--gold);border-left:1px solid var(--gold);}
.rc.tr{top:0;right:0;border-top:1px solid var(--gold);border-right:1px solid var(--gold);}
.rc.bl{bottom:0;left:0;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold);}
.rc.br{bottom:0;right:0;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold);}

.profile-card{padding:1.6rem 2rem;margin-bottom:1.5rem;
  display:flex;align-items:center;gap:1.5rem;
  box-shadow:0 0 30px rgba(220,20,60,0.1);}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:72px;height:72px;border-radius:50%;border:2px solid var(--crimson-bright);
  box-shadow:0 0 20px var(--crimson-glow);object-fit:cover;
  display:flex;align-items:center;justify-content:center;
  background:rgba(220,20,60,0.15);font-family:'Cinzel Decorative',serif;
  font-size:1.4rem;color:var(--crimson-bright);overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-ring{position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(201,168,76,0.4);animation:ringPulse 3s ease infinite;}
@keyframes ringPulse{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:.8;transform:scale(1.04);}}

.profile-info{flex:1;}
.profile-name{font-family:'Cinzel Decorative',serif;font-size:1.1rem;
  color:var(--text-primary);letter-spacing:0.08em;margin-bottom:4px;}
.profile-meta{font-size:0.82rem;color:var(--text-dim);letter-spacing:0.05em;margin-bottom:8px;}
.profile-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;
  background:rgba(220,20,60,0.1);border:1px solid rgba(220,20,60,0.3);color:var(--text-dim);
  clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);}
.book-btn{margin-left:auto;padding:0.7rem 1.6rem;font-family:'Cinzel',serif;font-size:0.65rem;
  letter-spacing:0.3em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--crimson-dark),var(--crimson));
  color:var(--text-primary);border:none;cursor:pointer;
  box-shadow:0 0 20px rgba(220,20,60,0.3);
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all 0.3s;flex-shrink:0;}
.book-btn:hover{background:linear-gradient(135deg,var(--crimson),var(--crimson-bright));
  box-shadow:0 0 35px rgba(220,20,60,0.55);transform:translateY(-1px);}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.stat-card{padding:1.2rem 1.4rem;transition:transform 0.25s,border-color 0.25s;cursor:default;}
.stat-card:hover{transform:translateY(-3px);border-color:rgba(220,20,60,0.5);}
.stat-label{font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:0.7rem;}
.stat-value{font-family:'Rajdhani',sans-serif;font-size:2rem;font-weight:700;line-height:1;}
.sv-white{color:var(--text-primary);}
.sv-green{color:#4ade80;text-shadow:0 0 12px rgba(74,222,128,0.5);}
.sv-gold{color:var(--gold-bright);text-shadow:0 0 12px var(--gold-glow);}
.sv-red{color:var(--crimson-bright);text-shadow:0 0 12px var(--crimson-glow);}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
.cal-title{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.35em;
  text-transform:uppercase;color:var(--text-primary);display:flex;align-items:center;gap:0.8rem;}
.cal-title::before,.cal-title::after{content:'';display:block;height:1px;width:40px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.4));}
.cal-legend{display:flex;gap:1rem;align-items:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-family:'Cinzel',serif;
  font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.ld-holiday{background:var(--crimson-bright);box-shadow:0 0 6px var(--crimson-glow);}
.ld-weekend{background:var(--gold);box-shadow:0 0 6px var(--gold-glow);}
.ld-today{background:var(--gold-bright);box-shadow:0 0 6px var(--gold-glow);}

.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.month-block{padding:1rem;}
.month-name{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.7rem;text-align:center;}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-hdr{font-family:'Cinzel',serif;font-size:0.5rem;letter-spacing:0.1em;
  text-align:center;color:var(--text-dim);padding:2px 0;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-size:0.72rem;font-weight:500;
  color:var(--text-secondary);border-radius:2px;cursor:default;transition:all 0.15s;position:relative;}
.day:hover:not(.empty):not(.holiday){background:rgba(220,20,60,0.12);color:var(--text-primary);}
.day.empty{pointer-events:none;}
.day.weekend{color:var(--gold);}
.day.holiday{background:rgba(220,20,60,0.2);color:var(--crimson-bright);
  font-weight:700;box-shadow:0 0 6px rgba(220,20,60,0.3);}
.day.today{background:rgba(201,168,76,0.25);color:var(--gold-bright);
  border:1px solid rgba(201,168,76,0.5);font-weight:700;}

.toast{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;
  padding:0.9rem 1.4rem;background:rgba(6,0,12,0.95);
  border:1px solid var(--gold);border-left:3px solid var(--gold);
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--gold);
  box-shadow:0 0 30px rgba(201,168,76,0.3);
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  opacity:0;transform:translateY(-10px);transition:all 0.4s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:900px){.months-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){
  .sidebar{position:fixed;left:-100%;transition:left 0.3s;z-index:100;}
  .sidebar.open{left:0;}
  .profile-card{flex-wrap:wrap;}
  .book-btn{width:100%;margin-left:0;}
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(220,20,60,0.3);}
</style>
<base target="_blank">
</head>
<body>

<div class="bg-canvas"></div>
<div class="embers" id="embers"></div>
<div class="toast" id="toast"></div>

<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="s-icon">♟</span>
    <span class="s-title">ChessMonk</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <div class="nav-item active">
      <span class="n-icon">⚔</span> Dashboard
    </div>
    <div class="nav-section-label" style="margin-top:0.5rem;">Bookings</div>
    <div class="nav-item" id="bookings-nav" onclick="toggleBookings()">
      <span class="n-icon">📅</span> Bookings
      <span class="n-arrow">▼</span>
    </div>
    <div class="nav-sub" id="bookings-sub">
      <div class="nav-sub-item" onclick="navigate('view-bookings.html')">
        <span class="dot"></span> View Bookings
      </div>
      <div class="nav-sub-item" onclick="navigate('book-tournament.html')">
        <span class="dot"></span> Book Tournament
      </div>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()">⚔ &nbsp;Retreat from Realm</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="welcome-text">
      <h2>Welcome, <span id="user-name">Warrior</span></h2>
      <p>⬦ Command your tournaments and bookings <span class="notif-dot"></span></p>
    </div>
  </div>

  <div class="glass profile-card">
    <div class="rune-pulse"></div>
    <div class="rc tl"></div><div class="rc tr"></div>
    <div class="rc bl"></div><div class="rc br"></div>
    <div class="avatar-wrap">
      <div class="avatar" id="avatar-el">♟</div>
      <div class="avatar-ring"></div>
    </div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name">Loading...</div>
      <div class="profile-meta" id="profile-meta">Loading...</div>
      <div class="profile-badge" id="active-tournament-badge">
        <span class="notif-dot" style="width:5px;height:5px;"></span>
        No Active Tournament
      </div>
    </div>
    <button class="book-btn" onclick="navigate('book-tournament.html')">✦ Book Tournament</button>
  </div>

  <div class="stats-grid">
    <div class="glass stat-card">
      <div class="rc tl"></div><div class="rc br"></div>
      <div class="stat-label">Total Slots</div>
      <div class="stat-value sv-white" id="stat-total">0</div>
    </div>
    <div class="glass stat-card">
      <div class="rc tl"></div><div class="rc br"></div>
      <div class="stat-label">Active Slots</div>
      <div class="stat-value sv-green" id="stat-active">0</div>
    </div>
    <div class="glass stat-card">
      <div class="rc tl"></div><div class="rc br"></div>
      <div class="stat-label">Holiday Shifted</div>
      <div class="stat-value sv-gold" id="stat-shifted">0</div>
    </div>
    <div class="glass stat-card">
      <div class="rc tl"></div><div class="rc br"></div>
      <div class="stat-label">Cancelled</div>
      <div class="stat-value sv-red" id="stat-cancelled">0</div>
    </div>
  </div>

  <div class="cal-header">
    <div class="cal-title">⬦ Year Overview ⬦</div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-dot ld-today"></div> Today</div>
      <div class="legend-item"><div class="legend-dot ld-holiday"></div> Holiday</div>
      <div class="legend-item"><div class="legend-dot ld-weekend"></div> Weekend</div>
    </div>
  </div>
  <div class="months-grid" id="months-grid"></div>
</main>

<script>
const token = localStorage.getItem('access_token');
if(!token) window.location.href = 'index.html';

const BASE_URL = 'http://127.0.0.1:8000/api';

const ec = document.getElementById('embers');
for(let i=0;i<35;i++){
  const e=document.createElement('div');
  e.className='ember '+(Math.random()>0.6?'gold':'red');
  e.style.setProperty('--dur',(7+Math.random()*12)+'s');
  e.style.setProperty('--delay',(Math.random()*15)+'s');
  e.style.setProperty('--left',(Math.random()*100)+'%');
  e.style.setProperty('--drift',((Math.random()-0.5)*100)+'px');
  ec.appendChild(e);
}

const HOLIDAYS = {
  '2025-01-01':'New Year','2025-01-14':'Makar Sankranti',
  '2025-01-26':'Republic Day','2025-03-14':'Holi',
  '2025-03-30':'Ugadi / Gudi Padwa','2025-04-14':'Dr. Ambedkar Jayanti',
  '2025-04-18':'Good Friday','2025-05-12':'Buddha Purnima',
  '2025-08-15':'Independence Day','2025-08-16':'Janmashtami',
  '2025-10-02':'Gandhi Jayanti / Dussehra',
  '2025-10-20':'Diwali','2025-10-21':'Diwali',
  '2025-11-05':'Guru Nanak Jayanti','2025-12-25':'Christmas',
  '2026-01-01':'New Year','2026-01-26':'Republic Day',
  '2026-03-20':'Holi','2026-04-14':'Dr. Ambedkar Jayanti',
  '2026-08-15':'Independence Day','2026-10-02':'Gandhi Jayanti',
  '2026-12-25':'Christmas',
};

function showToast(msg, duration=3500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

async function loadUser(){
  try{
    const res = await fetch(`${BASE_URL}/users/profile/`,{
      headers:{'Authorization':`Bearer ${token}`}
    });
    if(res.status === 401){ logout(); return; }
    if(!res.ok){ console.warn('Profile fetch failed:', res.status); return; }
    const user = await res.json();
    const firstName = user.full_name ? user.full_name.split(' ')[0] : 'Warrior';
    document.getElementById('user-name').textContent = firstName;
    document.getElementById('profile-name').textContent = user.full_name || '—';
    document.getElementById('profile-meta').textContent =
      `Age ${user.age||'—'} · ${user.gender ? user.gender.charAt(0).toUpperCase()+user.gender.slice(1) : '—'} · ${user.email}`;
    const av = document.getElementById('avatar-el');
    if(user.profile_pic){
      av.innerHTML = `<img src="http://127.0.0.1:8000${user.profile_pic}" alt="avatar"/>`;
    } else {
      av.textContent = (user.full_name || 'W').charAt(0).toUpperCase();
    }
    if(localStorage.getItem('just_registered')){
      showToast(`⚔ Welcome to the Realm, ${firstName}!`);
      localStorage.removeItem('just_registered');
    }
  } catch(err){
    console.error('Could not load user profile:', err);
    document.getElementById('profile-name').textContent = 'Could not load profile';
    document.getElementById('profile-meta').textContent = 'Check Django server';
  }
}

async function loadStats(){
  try{
    const res = await fetch(`${BASE_URL}/bookings/`,{
      headers:{'Authorization':`Bearer ${token}`}
    });
    if(res.status === 401){ logout(); return; }
    if(!res.ok) throw new Error('Failed to fetch');
    const data = await res.json();
    let raw=[];
    if(Array.isArray(data)) raw=data;
    else if(data.bookings) raw=data.bookings;
    else if(data.results) raw=data.results;
    else if(data.data) raw=data.data;

    let totalSlots = 0;
    let activeSlots = 0;
    let cancelledSlots = 0;
    let holidayShifted = 0;
    let hasActive = false;

    raw.forEach(b => {
      const plan = (b.plan||'').toLowerCase();
      const status = (b.status||'').toLowerCase();
      const slotCount = plan === 'monthly_premium' ? 8 : (plan === 'custom' ? (b.slots_count||1) : 1);

      totalSlots += slotCount;

      if(status === 'cancelled' || status === 'canceled'){
        cancelledSlots += slotCount;
      } else if(status === 'booked' || status === 'confirmed' || status === 'active'){
        activeSlots += slotCount;
        hasActive = true;
      }

      if(b.holiday_shifted || b.was_shifted || b.shifted_due_to_holiday){
        holidayShifted += slotCount;
      }
    });

    document.getElementById('stat-total').textContent = totalSlots;
    document.getElementById('stat-active').textContent = activeSlots;
    document.getElementById('stat-shifted').textContent = holidayShifted;
    document.getElementById('stat-cancelled').textContent = cancelledSlots;

    const badge = document.getElementById('active-tournament-badge');
    if(hasActive){
      badge.innerHTML = '<span class="notif-dot" style="width:5px;height:5px;"></span> Active Tournament Running';
      badge.style.borderColor = 'rgba(74,222,128,0.4)';
      badge.style.background = 'rgba(74,222,128,0.1)';
      badge.style.color = '#4ade80';
    } else {
      badge.innerHTML = '<span class="notif-dot" style="width:5px;height:5px;"></span> No Active Tournament';
      badge.style.borderColor = 'rgba(220,20,60,0.3)';
      badge.style.background = 'rgba(220,20,60,0.1)';
      badge.style.color = 'var(--text-dim)';
    }
  } catch(err){
    console.error('Stats load error:', err);
    document.getElementById('stat-total').textContent = '0';
    document.getElementById('stat-active').textContent = '0';
    document.getElementById('stat-shifted').textContent = '0';
    document.getElementById('stat-cancelled').textContent = '0';
  }
}

function buildCalendar(){
  const grid  = document.getElementById('months-grid');
  const today = new Date();
  const year  = today.getFullYear();
  const months= ['January','February','March','April','May','June',
                 'July','August','September','October','November','December'];
  const days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  months.forEach((mName, mIdx)=>{
    const block = document.createElement('div');
    block.className = 'glass month-block';
    block.innerHTML = `
      <div class="rc tl"></div><div class="rc br"></div>
      <div class="month-name">${mName} ${year}</div>
      <div class="day-headers">${days.map(d=>`<div class="day-hdr">${d}</div>`).join('')}</div>
      <div class="days-grid" id="days-${mIdx}"></div>
    `;
    grid.appendChild(block);

    const daysGrid  = block.querySelector(`#days-${mIdx}`);
    const firstDay  = new Date(year, mIdx, 1).getDay();
    const totalDays = new Date(year, mIdx+1, 0).getDate();

    for(let i=0;i<firstDay;i++){
      const emp=document.createElement('div');
      emp.className='day empty';
      daysGrid.appendChild(emp);
    }

    for(let d=1;d<=totalDays;d++){
      const cell   = document.createElement('div');
      const dow    = new Date(year, mIdx, d).getDay();
      const dateStr= `${year}-${String(mIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let cls = 'day';
      if(HOLIDAYS[dateStr])             cls += ' holiday';
      else if(dow===0 || dow===6)       cls += ' weekend';
      if(d===today.getDate() && mIdx===today.getMonth() && year===today.getFullYear())
                                        cls += ' today';
      cell.className = cls;
      cell.textContent = d;
      if(HOLIDAYS[dateStr]) cell.title = HOLIDAYS[dateStr];
      daysGrid.appendChild(cell);
    }
  });
}

function toggleBookings(){
  const nav=document.getElementById('bookings-nav');
  const sub=document.getElementById('bookings-sub');
  nav.classList.toggle('open');
  sub.classList.toggle('open');
}

  localStorage.clear();
  window.location.href = 'index.html';
}

loadUser();
loadStats();
buildCalendar();
